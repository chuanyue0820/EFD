name: EFD_Helen_x8_seed10
model_type: SRModel
scale: 8
num_gpu: 1
manual_seed: 10
datasets:
  train:
    task: SR
    name: Helen
    type: PairedImageDataset
    dataroot_gt: datasets/Helen/train/HR
    dataroot_lq: datasets/Helen/train/LR/x8
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 12
    batch_size_per_gpu: 32
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val:
    task: SR
    name: Helen
    type: PairedImageDataset
    dataroot_gt: datasets/Helen/test/HR
    dataroot_lq: datasets/Helen/test/LR/x8
    io_backend:
      type: disk
network_g:
  type: EFD
  upscale: 8
  in_chans: 3
  img_size: 64
  img_range: 1.0
  depth: 18
  embed_dim: 60
  num_heads: 6
  expansion_factor: 2
  split_size:
  - 8
  - 32
  semantic_ch: 19
  enable_edge_guidance: true
  enable_sem_guidance: true
  enable_sfa_symmetry: true
  enable_cta_component: true
  enable_dffn_ms_freq: true
path:
  pretrain_network_g: pretrained/EFD_Helen_x4_iter15000.pth
  strict_load_g: false
  resume_state: null
train:
  optim_g:
    type: Adam
    lr: 0.0002
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 250000
    - 400000
    - 450000
    - 475000
    gamma: 0.5
  total_iter: 500000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
val:
  val_freq: 5000.0
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 8
      test_y_channel: true
logger:
  print_freq: 200
  save_checkpoint_freq: 5000.0
  use_tb_logger: false
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 29500

name: EFD_CelebA_x4
model_type: SRModel
scale: 4
num_gpu: 1
manual_seed: 10
datasets:
  test:
    name: CelebA
    type: PairedImageDataset
    dataroot_gt: datasets/CelebA/test/HR
    dataroot_lq: datasets/CelebA/test/LR/x4
    io_backend:
      type: disk
network_g:
  type: EFD
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.0
  depth: 18
  embed_dim: 60
  num_heads: 6
  expansion_factor: 2
  split_size:
  - 8
  - 32
  semantic_ch: 19
  enable_edge_guidance: true
  enable_sem_guidance: true
  enable_sfa_symmetry: true
  enable_cta_component: true
  enable_dffn_ms_freq: true
path:
  pretrain_network_g: pretrained/EFD_CelebA_x4_iter320000.pth
  strict_load_g: true
  param_key_g: params
val:
  save_img: true
  suffix: EFD
  pbar: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
dist_params:
  backend: nccl
  port: 29500
